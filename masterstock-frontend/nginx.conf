# nginx sirve el frontend (Angular) y hace de proxy inverso hacia el backend.
# Asi el navegador solo ve un origen (un puerto, una IP): / va al frontend,
# /api/ se reenvia al contenedor del backend.

server {
    listen 80;
    server_name _;

    # Angular: index.html sirve todas las rutas (routing del lado del cliente)
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Archivos estaticos: cache larga (tienen hash en el nombre, son inmutables)
    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|webp|svg|ico)$ {
        try_files $uri =404;
        expires 30d;
        access_log off;
    }

    # Proxy inverso: todo lo que llega a /api/ se reenvia al backend
    location /api/ {
        proxy_pass http://backend:3000/api/;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
